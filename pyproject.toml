[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prevalidador"
version = "0.1.1"
description = "Sistema de prevalidación de cargas masivas en Excel basado en reglas JSON y catálogos externos"
authors = [ { name="Tu Nombre", email="tu@correo.com" } ]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1"
]

[project.urls]
"Homepage" = "https://github.com/tu_usuario/prevalidador"
"Repository" = "https://github.com/tu_usuario/prevalidador"

# ¡NUEVA SECCIÓN! Aquí es donde deben ir los scripts de consola
[project.scripts]
prevalidar = "prevalidador.main:main"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"prevalidador" = ["config/**/*.json", "config/**/*.xlsx", "config/**/*.csv"]

# Esta sección [tool.setuptools.entry-points] DEBE SER ELIMINADA
# ya que su contenido se movió a [project.scripts]
# [tool.setuptools.entry-points]
# console_scripts = [
#   "prevalidar=prevalidador.main:main"
# ]